frr version 8.4.1
frr defaults traditional
hostname AS100
log stdout
!
interface eth1
 ip address 198.51.100.1/30
!
interface lo
 ip address 10.100.0.1/16
!
router bgp 100
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 198.51.100.2 remote-as 200
 neighbor 198.51.100.2 description Transit_ISP_AS200
 !
 address-family ipv4 unicast
  network 10.100.0.0/16
  neighbor 198.51.100.2 activate
 exit-address-family
!
line vty
!

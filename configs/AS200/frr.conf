frr version 8.4.1
frr defaults traditional
hostname AS200
log stdout
!
interface eth1
 ip address 198.51.100.2/30
!
interface eth2
 ip address 203.0.113.1/30
!
router bgp 200
 bgp router-id 198.51.100.2
 no bgp ebgp-requires-policy
 neighbor 198.51.100.1 remote-as 100
 neighbor 198.51.100.1 description Legitimate_Victim_AS100
 neighbor 203.0.113.2 remote-as 300
 neighbor 203.0.113.2 description Peer_AS300
 !
 address-family ipv4 unicast
  neighbor 198.51.100.1 activate
  neighbor 203.0.113.2 activate
 exit-address-family
!
line vty
!

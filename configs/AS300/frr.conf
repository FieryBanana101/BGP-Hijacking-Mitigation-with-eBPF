frr version 8.4.1
frr defaults traditional
hostname AS300
log stdout
!
interface eth1
 ip address 203.0.113.2/30
!
interface lo
 ip address 203.0.113.100/32
!
router bgp 300
 bgp router-id 203.0.113.2
 no bgp ebgp-requires-policy
 neighbor 203.0.113.1 remote-as 200
 neighbor 203.0.113.1 description Transit_ISP_AS200
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 203.0.113.1 activate
 exit-address-family
!
line vty
!
